<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Page canvas</title>
    <style>
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #1d2330; color: #e6edf3; font: 14px/20px sans-serif; }
      #frame { position: absolute; left: 80px; top: 60px; padding: 12px; background: #3a4458; border: 2px solid #8899bb; border-radius: 8px; }
      #glow { position: absolute; left: -40px; top: -30px; width: 300px; height: 200px; background: #5a3d7a; filter: drop-shadow(6px 6px 0 #b05a3c); }
      #shadow { position: absolute; left: 24px; top: 316px; width: 120px; height: 50px; background: #2f6f5a; filter: drop-shadow(-30px 30px 0 #c0d040); }
      #blur { position: absolute; left: 560px; top: 280px; width: 140px; height: 120px; background: #3c8fb0; filter: blur(8px); }
      canvas { position: relative; display: block; width: 640px; height: 360px; }
      #label { position: absolute; left: 100px; top: 80px; padding: 4px 8px; background: rgba(0, 0, 0, 0.6); }
    </style>
  </head>
  <body>
    <div id="frame"><div id="glow"></div><div id="shadow"></div><div id="blur"></div><canvas id="renderCanvas"></canvas></div>
    <div id="label">Text scene on a page canvas</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
