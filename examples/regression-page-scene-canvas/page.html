<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page scene canvas</title>
    <style>
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #2f4a3a; }
      #banner { height: 40px; margin: 0 0 -20px; background: #c9a227; }
      #sceneCanvas { display: block; width: 640px; height: 360px; margin: 0 0 0 80px; background: #ff00ff; }
      #label { position: absolute; left: 100px; top: 340px; padding: 4px 8px; background: #102018; color: #e8e4d8; font: 13px/18px sans-serif; }
    </style>
  </head>
  <body>
    <div id="banner"></div>
    <canvas id="sceneCanvas"></canvas>
    <div id="label">drawn over the scene</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
