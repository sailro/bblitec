name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  boombox-parity:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run compile:boombox
      - name: Configure native Release build
        shell: pwsh
        run: |
          $vcpkgRoot = if ($env:VCPKG_INSTALLATION_ROOT) { $env:VCPKG_INSTALLATION_ROOT } else { "C:\vcpkg" }
          git -C $vcpkgRoot fetch origin ea1a7396b05637a53bf23c078647ecc0edee4b80 --depth=1
          git -C $vcpkgRoot checkout --force ea1a7396b05637a53bf23c078647ecc0edee4b80
          cmake -S native -B native\build-boombox-release -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$vcpkgRoot\scripts\buildsystems\vcpkg.cmake" `
            -DBBLITE_GENERATED_DIR="$PWD\generated\boombox"
      - name: Build native Release target
        run: cmake --build native\build-boombox-release --config Release
      - name: Compare native render with Babylon.js
        run: npm run parity:boombox -- --exe native\build-boombox-release\Release\bblite_native.exe
      - name: Upload parity artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boombox-parity
          path: artifacts/parity
